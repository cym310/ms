<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>自言自语 · 打字转语音</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect x='3' y='9' width='4' height='6' rx='2' fill='%2334d399'/%3E%3Crect x='10' y='4' width='4' height='16' rx='2' fill='%237c9cff'/%3E%3Crect x='17' y='7' width='4' height='10' rx='2' fill='%23a78bfa'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://miaoda.feishu.cn/fonts/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&display=swap">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg1:#0a0f1f;--bg2:#131a38;
  --panel:rgba(255,255,255,.05);
  --panel2:rgba(255,255,255,.075);
  --line:rgba(255,255,255,.09);
  --line2:rgba(255,255,255,.16);
  --text:#e9efff;--muted:#98a3c8;--faint:#6b7699;
  --accent:#34d399;--blue:#7c9cff;--violet:#a78bfa;
  --key:#1a2240;--key2:#232e58;--keyLine:rgba(255,255,255,.08);
  --ease:cubic-bezier(.22,1,.36,1);
}
html,body{height:100%}
body{
  font-family:"Noto Sans SC",-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
  background:linear-gradient(160deg,var(--bg1),var(--bg2));
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ===== 背景光晕 ===== */
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;will-change:transform}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-16vmax;background:radial-gradient(circle at 35% 35%,rgba(52,211,153,.5),transparent 62%);animation:drift1 26s ease-in-out infinite alternate}
.b2{width:42vmax;height:42vmax;right:-12vmax;top:6vmax;background:radial-gradient(circle at 60% 40%,rgba(124,156,255,.55),transparent 62%);animation:drift2 32s ease-in-out infinite alternate}
.b3{width:40vmax;height:40vmax;left:18vmax;bottom:-20vmax;background:radial-gradient(circle at 50% 50%,rgba(167,139,250,.4),transparent 62%);animation:drift3 38s ease-in-out infinite alternate}
@keyframes drift1{to{transform:translate(7vmax,5vmax) scale(1.12)}}
@keyframes drift2{to{transform:translate(-6vmax,8vmax) scale(.92)}}
@keyframes drift3{to{transform:translate(4vmax,-6vmax) scale(1.08)}}

/* ===== 应用壳 ===== */
.app{
  position:relative;z-index:1;
  height:100vh;height:100dvh;max-width:920px;margin:0 auto;
  display:flex;flex-direction:column;
  background:rgba(10,15,31,.55);
  border-left:1px solid var(--line);border-right:1px solid var(--line);
  backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);
}
@media(min-width:721px){
  body{padding:16px}
  .app{height:calc(100vh - 32px);height:calc(100dvh - 32px);border:1px solid var(--line);border-radius:30px;box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
}

/* ===== 顶栏 ===== */
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 18px 12px;border-bottom:1px solid var(--line);flex:none}
.brand{display:flex;align-items:center;gap:11px;cursor:pointer;user-select:none}
.brand-mark{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,rgba(52,211,153,.22),rgba(124,156,255,.22));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;gap:3px}
.brand-mark i{width:3px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--blue));animation:wave .95s ease-in-out infinite}
.brand-mark i:nth-child(1){height:10px}
.brand-mark i:nth-child(2){height:18px;animation-delay:.12s}
.brand-mark i:nth-child(3){height:14px;animation-delay:.24s}
.brand-mark i:nth-child(4){height:20px;animation-delay:.36s}
.brand-mark i:nth-child(5){height:11px;animation-delay:.48s}
.brand-text h1{font-size:17px;font-weight:700;letter-spacing:.14em}
.brand-text p{font-size:11px;color:var(--muted);letter-spacing:.22em;margin-top:1px}
.top-actions{display:flex;align-items:center;gap:9px}
.pill{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);color:var(--text);font-size:12.5px;cursor:pointer;transition:.25s var(--ease);white-space:nowrap}
.pill:hover{background:var(--panel2);border-color:rgba(52,211,153,.5)}
.pill svg{width:15px;height:15px;color:var(--accent);flex:none}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);flex:none}
.icon-btn{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;transition:.25s var(--ease);flex:none}
.icon-btn:hover{color:var(--text);border-color:var(--line2);background:var(--panel2)}
.icon-btn svg{width:16px;height:16px}

/* ===== 消息区 ===== */
.stage{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:20px 16px 10px}
.stage::-webkit-scrollbar{width:6px}
.stage::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100%;text-align:center;gap:8px;padding:40px 24px}
.empty.hide{display:none}
.empty-icon{width:76px;height:76px;border-radius:50%;background:linear-gradient(135deg,rgba(52,211,153,.16),rgba(124,156,255,.16));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;margin-bottom:8px;animation:pulseSoft 3.2s ease-in-out infinite}
.empty-icon svg{width:36px;height:36px;color:var(--accent)}
.empty h2{font-size:18px;font-weight:600;letter-spacing:.08em}
.empty p{font-size:13px;color:var(--muted);line-height:1.9}
.empty .sub{color:var(--faint);font-size:12px}
@keyframes pulseSoft{0%,100%{box-shadow:0 0 0 0 rgba(52,211,153,.25)}50%{box-shadow:0 0 0 18px rgba(52,211,153,0)}}
.msg-list{display:flex;flex-direction:column;gap:14px;max-width:660px;margin:0 auto;padding-bottom:8px}
.msg{display:flex;gap:10px;animation:msgIn .55s var(--ease) both}
.msg-avatar{flex:none;width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,#1f2b52,#2c2152);border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;margin-top:2px}
.msg-avatar svg{width:16px;height:16px;color:var(--blue)}
.msg-body{flex:1;min-width:0}
.msg-text{display:inline-block;max-width:100%;background:rgba(255,255,255,.065);border:1px solid var(--line);border-radius:4px 16px 16px 16px;padding:11px 15px;font-size:15.5px;line-height:1.7;white-space:pre-wrap;word-break:break-word;transition:border-color .3s,background .3s}
.msg.speaking .msg-text{border-color:rgba(52,211,153,.55);background:rgba(52,211,153,.09)}
.msg-wave{display:none;align-items:center;height:18px;margin-top:7px}
.msg.speaking .msg-wave{display:flex}
@keyframes msgIn{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}

/* ===== 波形 ===== */
.wave{display:inline-flex;align-items:center;gap:3px;height:20px}
.wave i{display:block;width:4px;border-radius:3px;background:linear-gradient(180deg,var(--accent),var(--blue));transform:scaleY(.25);transform-origin:center;animation:wave 1s ease-in-out infinite}
.wave i:nth-child(2){animation-delay:.13s}
.wave i:nth-child(3){animation-delay:.26s}
.wave i:nth-child(4){animation-delay:.39s}
.wave i:nth-child(5){animation-delay:.52s}
@keyframes wave{0%,100%{transform:scaleY(.25)}50%{transform:scaleY(1)}}

/* ===== 底部坞 ===== */
.dock{flex:none;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:linear-gradient(180deg,rgba(10,15,31,.3),rgba(10,15,31,.88));border-top:1px solid var(--line)}
.speaking-bar{display:flex;align-items:center;gap:10px;max-width:660px;margin:0 auto 10px;padding:7px 13px;border-radius:14px;background:rgba(52,211,153,.07);border:1px solid rgba(52,211,153,.22);opacity:0;transform:translateY(6px);pointer-events:none;transition:.35s var(--ease)}
.speaking-bar.show{opacity:1;transform:none;pointer-events:auto}
.speaking-tag{flex:none;font-size:11px;color:var(--accent);letter-spacing:.12em;border:1px solid rgba(52,211,153,.35);border-radius:999px;padding:2px 8px}
.speaking-text{flex:1;min-width:0;font-size:13.5px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* ===== 组合条 ===== */
.compose-bar{max-width:660px;margin:0 auto 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.compose-bar[hidden]{display:none}
.compose-prefix{font-size:11px;color:var(--violet);letter-spacing:.14em;flex:none}
.compose-text{display:inline-flex;align-items:center;gap:7px;background:rgba(167,139,250,.1);border:1px solid rgba(167,139,250,.28);border-radius:10px;padding:4px 10px;font-size:14px;min-height:28px;flex-wrap:wrap}
.caret{display:inline-block;width:2px;height:16px;background:var(--violet);border-radius:1px;animation:caret 1.1s steps(2) infinite}
@keyframes caret{50%{opacity:0}}
.cand{font-size:13px;color:var(--text);background:rgba(255,255,255,.09);border:1px solid var(--line);border-radius:7px;padding:2px 8px;cursor:pointer;transition:.2s}
.cand:hover{background:rgba(52,211,153,.2);border-color:rgba(52,211,153,.5)}

/* ===== 输入行 ===== */
.input-row{max-width:660px;margin:0 auto;display:flex;align-items:flex-end;gap:9px;background:var(--panel);border:1px solid var(--line2);border-radius:18px;padding:7px 7px 7px 14px;transition:border-color .3s,box-shadow .3s}
.input-row:focus-within{border-color:rgba(52,211,153,.55);box-shadow:0 0 0 3px rgba(52,211,153,.12)}
#input{flex:1;min-width:0;background:transparent;border:0;outline:0;resize:none;color:var(--text);font:inherit;font-size:16.5px;line-height:1.55;padding:8px 0;max-height:118px}
#input::placeholder{color:var(--faint)}
.send-btn{flex:none;width:44px;height:44px;border-radius:14px;border:0;cursor:pointer;background:linear-gradient(135deg,var(--accent),#22c1a3 60%,var(--blue));color:#06121a;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(52,211,153,.35);transition:transform .2s var(--ease),box-shadow .2s}
.send-btn:hover{transform:translateY(-1px) scale(1.04);box-shadow:0 8px 22px rgba(52,211,153,.45)}
.send-btn:active{transform:scale(.94)}
.send-btn svg{width:19px;height:19px}

/* ===== 自定义输入法 ===== */
.ime{max-width:660px;margin:10px auto 0;padding:2px;user-select:none;-webkit-user-select:none}
.ime[hidden]{display:none}
.ime-row{display:flex;gap:6px;margin-bottom:7px}
.key{flex:1;height:44px;border:1px solid var(--keyLine);border-radius:11px;background:linear-gradient(180deg,var(--key2),var(--key));color:var(--text);font-size:18px;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:4px;cursor:pointer;box-shadow:0 3px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.07);transition:transform .07s,background .15s,box-shadow .07s;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.key:hover{background:linear-gradient(180deg,var(--key2),#28345f)}
.key:active{transform:translateY(2px) scale(.97);box-shadow:0 1px 0 rgba(0,0,0,.35),0 0 14px rgba(52,211,153,.35)}
.key.tool{flex:1.45;font-size:15px;color:var(--muted)}
.key.tool svg{width:19px;height:19px}
.key.wide{flex:5;font-size:15px;color:var(--muted);letter-spacing:.2em}
.key.enter{flex:2;font-size:14px;color:#07131c;background:linear-gradient(180deg,var(--accent),#2bc49a);border-color:rgba(52,211,153,.6);letter-spacing:.05em}
.key.enter:active{box-shadow:0 1px 0 rgba(0,0,0,.3),0 0 16px rgba(52,211,153,.5)}
.key.shift-on{color:var(--accent);border-color:rgba(52,211,153,.5)}
.key.sym{font-size:15px}
.key.k9key{position:relative;padding:4px 2px;flex:1}
.key.k9key .k9{display:block;font-size:11px;color:var(--muted);letter-spacing:.08em;line-height:1}
.key.k9key .k9-main{display:block;font-size:17px;font-weight:600;line-height:1.15;margin-top:2px;color:var(--text)}
.key.k9key .k9-main::after{content:"";display:block;width:14px;height:2px;border-radius:1px;background:var(--accent);margin:1px auto 0;transition:.15s}
.key.k9key:active .k9-main::after{box-shadow:0 0 8px var(--accent)}
.listen-btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;height:42px;margin-top:6px;border:1px solid rgba(52,211,153,.4);border-radius:12px;background:rgba(52,211,153,.08);color:var(--accent);font-size:13.5px;font-family:inherit;cursor:pointer;transition:.25s var(--ease)}
.listen-btn:hover{background:rgba(52,211,153,.16)}
.listen-btn:active{transform:scale(.97)}
.listen-btn svg{width:16px;height:16px}

/* ===== 弹层 ===== */
.overlay{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;background:rgba(5,8,20,.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s}
.overlay.show{opacity:1;pointer-events:auto}
.overlay[hidden]{display:none}
.sheet{width:min(560px,100%);max-height:88dvh;overflow:auto;background:linear-gradient(180deg,#161d3c,#10162e);border:1px solid var(--line2);border-radius:24px;box-shadow:0 30px 80px rgba(0,0,0,.5);transform:translateY(22px) scale(.95);transition:transform .38s var(--ease);padding:22px}
.overlay.show .sheet{transform:none}
.sheet::-webkit-scrollbar{width:5px}
.sheet::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.sheet-head h2{font-size:18px;font-weight:700;letter-spacing:.12em}
.set-group{margin-bottom:20px}
.set-group h3{font-size:12px;color:var(--muted);letter-spacing:.16em;font-weight:500;margin-bottom:10px;display:flex;align-items:center;gap:10px}
.set-group h3::after{content:"";flex:1;height:1px;background:var(--line)}
.opt{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;cursor:pointer;transition:.25s var(--ease);background:rgba(255,255,255,.03)}
.opt:hover{border-color:var(--line2);background:rgba(255,255,255,.06)}
.opt:has(input:checked){border-color:rgba(52,211,153,.5);background:rgba(52,211,153,.07)}
.opt input{margin-top:3px;accent-color:var(--accent);width:16px;height:16px;flex:none}
.opt b{display:block;font-size:14.5px;font-weight:600}
.opt i{display:block;font-style:normal;font-size:12px;color:var(--muted);margin-top:3px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 2px;font-size:13.5px;color:var(--text)}
.field>span{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.field em{font-style:normal;color:var(--accent);font-size:12px;min-width:34px}
select{background:#1a2140;color:var(--text);border:1px solid var(--line2);border-radius:10px;padding:7px 10px;font-size:13px;font-family:inherit;outline:0;max-width:58%;min-width:0}
input[type=range]{flex:1;accent-color:var(--accent);height:20px;min-width:0}
.set-note{font-size:12px;color:var(--faint);line-height:1.8;border-top:1px dashed var(--line);padding-top:14px;margin-top:4px}

/* ===== 欢迎弹窗 ===== */
.welcome{text-align:center;padding:34px 26px 30px}
.welcome-logo{width:66px;height:66px;margin:0 auto 18px;border-radius:50%;background:linear-gradient(135deg,rgba(52,211,153,.25),rgba(124,156,255,.25));border:1px solid var(--line2);display:flex;align-items:center;justify-content:center;animation:pulseSoft 3s ease-in-out infinite}
.welcome-logo svg{width:30px;height:30px;color:var(--accent)}
.welcome h2{font-size:20px;font-weight:700;letter-spacing:.08em;margin-bottom:12px}
.welcome p{font-size:14px;color:var(--muted);line-height:2.1}
.btn-primary{margin-top:20px;width:100%;height:46px;border:0;border-radius:14px;cursor:pointer;font-size:15px;font-weight:600;color:#06121a;background:linear-gradient(135deg,var(--accent),#22c1a3 60%,var(--blue));box-shadow:0 8px 24px rgba(52,211,153,.35);transition:.25s var(--ease)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 28px rgba(52,211,153,.45)}
.btn-primary:active{transform:scale(.97)}

/* ===== 提示 ===== */
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translate(-50%,-18px);z-index:80;background:rgba(16,22,46,.92);border:1px solid var(--line2);border-radius:999px;padding:9px 18px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.4);opacity:0;transition:.35s var(--ease);pointer-events:none;white-space:nowrap;max-width:86vw;overflow:hidden;text-overflow:ellipsis}
.toast.show{transform:translate(-50%,0);opacity:1}

/* ===== 响应式 ===== */
@media(max-width:560px){
  .topbar{padding:12px 14px 10px}
  .brand-text p{display:none}
  .key{height:41px;font-size:17px;border-radius:9px}
  .key.tool{font-size:14px}
  .key.sym{font-size:14px}
  .ime-row{gap:5px}
  .stage{padding:16px 12px 6px}
  .msg-text{font-size:15px}
}
@media(max-width:380px){.key.wide{flex:4}.key.enter{flex:1.7}}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.001s!important;animation-iteration-count:1!important;transition-duration:.001s!important}
  .blob{display:none}
}
</style>
</head>
<body>
<div class="bg"><i class="blob b1"></i><i class="blob b2"></i><i class="blob b3"></i></div>

<div class="app">
  <!-- 顶栏 -->
  <header class="topbar">
    <div class="brand" id="brand" title="点我，我会自我介绍">
      <div class="brand-mark"><i></i><i></i><i></i><i></i><i></i></div>
      <div class="brand-text">
        <h1>自言自语</h1>
        <p>打字 · 即念 · 万物有声</p>
      </div>
    </div>
    <div class="top-actions">
      <button class="pill" id="imePill" aria-label="切换输入法"><span class="dot"></span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="2.5" y="6.5" width="19" height="11" rx="2.5"/><path d="M6.5 11h.01M9.5 11h.01M12.5 11h.01M15.5 11h.01M18.5 11h.01M6.5 14h.01M18.5 14h.01M9 14h6"/></svg><span id="imePillText">自定义输入法</span></button>
      <button class="icon-btn" id="stopBtn" aria-label="停止说话" title="停止说话"><svg viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="6" width="12" height="12" rx="3"/></svg></button>
      <button class="icon-btn" id="settingsBtn" aria-label="设置" title="设置"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1.03 1.56V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.11-1.56 1.7 1.7 0 0 0-1.87.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.56-1.03H3a2 2 0 1 1 0-4h.09A1.7 1.7 0 0 0 4.65 8.9a1.7 1.7 0 0 0-.34-1.87l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1.03-1.56V3a2 2 0 1 1 4 0v.09c0 .68.4 1.3 1.03 1.56a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.87v.01c.26.63.88 1.03 1.56 1.03H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.51 1.03z"/></svg></button>
    </div>
  </header>

  <!-- 消息区 -->
  <main class="stage" id="stage">
    <div class="empty" id="empty">

/* ================= 状态 ================= */
const state = {

  speechMode: 'sentence',   // sentence 打一句念一句 | enter 回车再念
  enterBehavior: 'send',    // send 发送 | newline 换行
  layout: 'qwerty',         // qwerty 26键 | nine 9键

  shift: false, page: 'abc',
  buffer: '',               // 输入法组合缓冲
  caret: 0,                 // 文本区虚拟光标
  spokenUpTo: 0,            // 已朗读到的文本位置
  voices: [], toastTimer: null, msgSeq: 0,
  nineKey: '', nineIdx: 0, nineStart: 0   // 9键多击轮换状态
};

/* ================= 元素 ================= */
const els = {
  input: $('#input'), sendBtn: $('#sendBtn'),
  ime: $('#ime'), imePillText: $('#imePillText'),
  composeBar: $('#composeBar'), composeText: $('#composeText'),
  stage: $('#stage'), msgList: $('#msgList'), empty: $('#empty'),
  speakingBar: $('#speakingBar'), speakingText: $('#speakingText'),
  settingsOverlay: $('#settingsOverlay'), welcomeOverlay: $('#welcomeOverlay'),
  toast: $('#toast'), stopBtn: $('#stopBtn'), brand: $('#brand'),
  settingsBtn: $('#settingsBtn'), settingsClose: $('#settingsClose'),
  voiceSel: $('#voiceSel'), rateRange: $('#rateRange'), pitchRange: $('#pitchRange'),
  rateVal: $('#rateVal'), pitchVal: $('#pitchVal'),
  modeSentence: $('#modeSentence'), modeEnter: $('#modeEnter'),

/* ================= 图标 ================= */

/* ================= 语音引擎 ================= */
const Speech = {
  queue: [], speaking: false, _busy: false, _current: null, _timer: null,
  speak(text, meta) {
    text = String(text || '').trim();
    if (!text) return;
    if (this.queue.length > 40) this.queue = this.queue.slice(-25);
    this.queue.push({ text, meta: meta || {} });
    this.next();
  },
  next() {
    if (this._busy) return;
    if (!this.queue.length) { this.speaking = false; this.setUI(false); return; }
    this.speaking = true;
    this._busy = true;
    const u = this.queue.shift();
    this._current = u;
    if (!('speechSynthesis' in window)) {
      this.speaking = false; this._busy = false; this.setUI(false); this.next(); return;
    }
    try { speechSynthesis.resume(); } catch (e) {}
    let utter;
    try { utter = new SpeechSynthesisUtterance(u.text); }
    catch (e) { this.speaking = false; this._busy = false; this.setUI(false); this.next(); return; }
    utter.lang = 'zh-CN';
    const v = this.pickVoice();
    if (v) utter.voice = v;
    utter.rate = state.rate; utter.pitch = state.pitch; utter.volume = 1;
    const finish = () => {
      if (this._current !== u) return;
      clearTimeout(this._timer);
      this._current = null;
      this._busy = false;
      this.setUI(false);
      this.next();
    };
    utter.onstart = () => { if (this._current === u) this.setUI(true, u); };
    utter.onend = finish;
    utter.onerror = e => {
      if (this._current !== u) return;
      if (e && e.error === 'canceled') {
        clearTimeout(this._timer);
        this.queue = []; this.speaking = false; this._busy = false; this._current = null;
        this.setUI(false);
      } else {
        finish();
      }
    };
    try { speechSynthesis.speak(utter); }
    catch (e) { this._busy = false; this._current = null; this.setUI(false); this.next(); return; }
    // 超时兜底：防止个别浏览器 onend 不触发导致队列卡死
    this._timer = setTimeout(() => {
      if (this._current === u) {
        this._current = null;
        this._busy = false;
        this.setUI(false);
        try { speechSynthesis.cancel(); } catch (e) {}
        this.next();
      }
    }, Math.max(8000, u.text.length * 700));
  },
  stop() {
    try { speechSynthesis.cancel(); } catch (e) {}
    clearTimeout(this._timer);
    this.queue = []; this.speaking = false; this._busy = false; this._current = null;
    this.setUI(false);
  },
  pickVoice() {
    if (state.voiceURI) {
      const f = state.voices.find(v => v.voiceURI === state.voiceURI);
      if (f) return f;
    }
    return state.voices.find(v => v.lang && v.lang.toLowerCase().startsWith('zh')) || null;
  },
  setUI(on, u) {
    const isText = on && u && (u.meta.source === 'input' || u.meta.source === 'bubble');
    els.speakingBar.classList.toggle('show', !!isText);
    if (isText) {
      els.speakingText.textContent = u.text.length > 46 ? u.text.slice(0, 46) + '…' : u.text;
    }
    document.querySelectorAll('.msg.speaking').forEach(m => m.classList.remove('speaking'));
    if (isText && u.meta.source === 'bubble' && u.meta.id) {
      const m = document.querySelector('[data-id="' + u.meta.id + '"]');
      if (m) m.classList.add('speaking');
    }
  }
};

/* 字母合并朗读：连续按键合并成一次念，避免打断与卡顿 */
let letterTimer = null, letterBuf = '';
function speakLetters(ch) {
  letterBuf += ch;
  clearTimeout(letterTimer);
  letterTimer = setTimeout(() => {
    const s = letterBuf;
    letterBuf = '';
    if (s) Speech.speak(s);
  }, 240);
}
function flushLetters() {
  clearTimeout(letterTimer);
  letterBuf = '';
}
/* 音色选择 */
function loadVoices() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  if (!vs.length) return;
  const zh = vs.filter(v => v.lang && v.lang.toLowerCase().indexOf('zh') === 0);
  state.voices = zh.length ? zh : vs;
  els.voiceSel.innerHTML = '';
  state.voices.forEach(v => {
    const o = document.createElement('option');
    o.value = v.voiceURI;
    const short = (v.name || '').replace(/\s*(zh[-_ ]?CN|Chinese|普通话|中文).*$/i, '').trim() || v.name;
    o.textContent = short + ' · ' + (v.lang || '');
    els.voiceSel.appendChild(o);
  });
  if (!state.voiceURI) {
    state.voiceURI = state.voices[0] ? state.voices[0].voiceURI : '';
    els.voiceSel.value = state.voiceURI;
  }
}
if ('speechSynthesis' in window) {
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

/* ================= 按键音 ================= */
let actx = null;
function tick(freq) {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === 'suspended') actx.resume();
    const t = actx.currentTime;
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = 'sine';
    o.frequency.value = freq || 520;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.linearRampToValueAtTime(0.1, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + 0.07);
    o.connect(g); g.connect(actx.destination);
    o.start(t); o.stop(t + 0.08);
  } catch (e) {}
}

/* ================= 键盘布局 ================= */
const KEY9 = { '2':'abc', '3':'def', '4':'ghi', '5':'jkl', '6':'mno', '7':'pqrs', '8':'tuv', '9':'wxyz' };
const LAYOUT = {
  qwerty: [
    ['1','2','3','4','5','6','7','8','9','0'],
    ['q','w','e','r','t','y','u','i','o','p'],
    ['a','s','d','f','g','h','j','k','l'],
    ['shift','z','x','c','v','b','n','m','back'],
    ['globe','26','123','left','right','space','enter']
  ],
  nine: [
    ['1','2','3'],
    ['4','5','6'],
    ['7','8','9'],
    ['star','0','hash'],
    ['globe','26','back','space','enter']
  ],
  sym: [
    ['.',',','!','?',"'",'"',':',';'],
    ['(',')','[',']','{','}','<','>'],
    ['-','_','=','+','/','\\','@','#','%','&','*'],
    ['abc','left','right','space','back','enter']
  ]
};

function keyLabel(k) {
  if (k === 'space') return '空格';
  if (k === 'enter') return state.enterBehavior === 'send' ? '发送' : '换行';
  if (k === 'shift') return '⇧';
  if (k === 'back') return '⌫';
  if (k === 'left') return '◀';
  if (k === 'right') return '▶';
  if (k === 'abc') return 'ABC';
  if (k === '123') return '123';
  if (k === '26') return state.layout === 'nine' ? '26' : '9';
  if (k === 'star') return '＊';
  if (k === 'hash') return '，';
  if (k === 'globe') return ICO.globe;
  if (state.layout === 'nine' && k === '0') return '空格';
  if (state.layout === 'nine' && KEY9[k]) {
    const set = KEY9[k];
    const cur = set[state.nineKey === k ? state.nineIdx : 0];
    return '<span class="k9">' + set + '</span><span class="k9-main">' + cur + '</span>';
  }
  return k;
}
function keyHtml(k) {
  let type = 'char';
  if (k === 'space') type = 'wide';
  if (k === 'enter') type = 'enter';
  if (['globe','left','right','shift','back','abc','123','26','star','hash'].indexOf(k) !== -1) type = 'tool';
  if (state.layout === 'nine' && KEY9[k]) type = 'k9key';
  let label = keyLabel(k);
  if (state.shift && /^[a-z]$/.test(k)) label = k.toUpperCase();
  const cls = type + (state.shift && k === 'shift' ? ' shift-on' : '');
  const aria = esc(label.replace(/<[^>]+>/g, ''));
  return '<button class="key ' + cls + '" data-k="' + k + '" aria-label="' + aria + '">' + label + '</button>';
}
function renderIme() {
  const rows = state.page === 'sym' ? LAYOUT.sym : LAYOUT[state.layout];
  els.ime.innerHTML = rows.map(r => '<div class="ime-row">' + r.map(keyHtml).join('') + '</div>').join('');
}

/* ================= 文本操作 ================= */
function growInput() {
  els.input.style.height = 'auto';
  els.input.style.height = Math.min(els.input.scrollHeight, 118) + 'px';
}
function scrollBottom() {
  els.stage.scrollTop = els.stage.scrollHeight;
}
function syncInput(doSentences) {
  growInput();
  scrollBottom();
  if (doSentences) handleSentences();
}
function insertChar(ch) {
  const t = els.input.value, at = Math.min(state.caret, t.length);
  els.input.value = t.slice(0, at) + ch + t.slice(at);
  state.caret = at + ch.length;
  if (state.caret <= state.spokenUpTo) state.spokenUpTo += ch.length;
  syncInput(false);
}
function insertText(txt) {
  if (!txt) return;
  const t = els.input.value, at = Math.min(state.caret, t.length);
  els.input.value = t.slice(0, at) + txt + t.slice(at);
  state.caret = at + txt.length;
  if (state.caret <= state.spokenUpTo) state.spokenUpTo += txt.length;
  syncInput(false);
}
function moveCaret(d) {
  const t = els.input.value;
  state.caret = Math.max(0, Math.min(t.length, state.caret + d));
  try { els.input.setSelectionRange(state.caret, state.caret); } catch (e) {}
}
function commitBuffer() {
  if (!state.buffer) return '';
  const w = state.buffer;
  state.buffer = '';
  insertText(w);
  renderCompose();
  return w;
}

/* ================= 句子朗读 ================= */
function handleSentences() {
  if (state.speechMode !== 'sentence') return;
  const text = els.input.value;
  if (text.length < state.spokenUpTo) { state.spokenUpTo = text.length; return; }
  const seg = text.slice(state.spokenUpTo);
  if (!seg) return;
  const re = /[^。！？…!?.;；]+[。！？…!?.;；]/g;
  let m, covered = 0;
  while ((m = re.exec(seg))) covered = m.index + m[0].length;
  re.lastIndex = 0;
  while ((m = re.exec(seg))) Speech.speak(m[0].trim(), { source: 'input' });
  state.spokenUpTo += covered;
}

/* ================= 组合条 ================= */
function renderCompose() {
  if (!state.buffer) { els.composeBar.hidden = true; return; }
  els.composeBar.hidden = false;
  const lower = state.buffer.toLowerCase();
  const hits = [];
  Object.keys(DICT).forEach(k => {
    if (k.indexOf(lower) === 0 && hits.indexOf(DICT[k]) === -1) hits.push(DICT[k]);
  });
  const chips = hits.slice(0, 3).map(w => '<button class="cand" data-w="' + esc(w) + '">' + esc(w) + '</button>').join('');
  els.composeText.innerHTML = '<span>' + esc(state.buffer) + '</span><span class="caret"></span>' + chips;
}

/* ================= 输入法按键 ================= */
function resetNine() { state.nineKey = ''; }
function typeChar(ch) {
  const isLetter = /^[a-zA-Z]$/.test(ch);
  const isDigit = /^[0-9]$/.test(ch);
  if (isLetter) {
    const up = state.shift ? ch.toUpperCase() : ch;
    state.buffer += up;
    if (state.shift) { state.shift = false; renderIme(); }
    renderCompose();
    tick(letterFreq(ch));
    speakLetters(up);
    return;
  }
  if (isDigit) {
    commitBuffer();
    insertChar(ch);
    tick(letterFreq(ch));
    Speech.speak(ch);
    return;
  }
}
/* 9 键多击轮换：点一次=a，再点=b，再点=c */
function nineTap(k) {
  const set = KEY9[k];
  if (state.nineKey === k) {
    state.nineIdx = (state.nineIdx + 1) % set.length;
    state.buffer = state.buffer.slice(0, state.nineStart) + set[state.nineIdx];
  } else {
    state.nineKey = k;
    state.nineIdx = 0;
    state.nineStart = state.buffer.length;
    state.buffer += set[0];
  }
  renderIme();
  renderCompose();
  tick(letterFreq(set[state.nineIdx]));
  Speech.speak(set[state.nineIdx]);
}
function spaceKey() {
  flushLetters();
  const w = commitBuffer();
  resetNine();
  insertChar(' ');
  if (w) {
    if (state.speechMode === 'sentence') { Speech.speak(w, { source: 'input' }); state.spokenUpTo = state.caret; }
  } else {
    Speech.speak('空格');
  }
  tick(300);
}
function backspace() {
  flushLetters();
  resetNine();
  if (state.buffer) {
    state.buffer = state.buffer.slice(0, -1);
    renderCompose();
    tick(300);
    Speech.speak('退格');
    return;
  }
  if (!els.input.value.length) return;
  const t = els.input.value;
  const at = Math.max(0, state.caret - 1);
  els.input.value = t.slice(0, at) + t.slice(state.caret);
  if (state.caret <= state.spokenUpTo) state.spokenUpTo = Math.max(0, state.spokenUpTo - 1);
  state.caret = at;
  syncInput(false);
  tick(300);
  Speech.speak('退格');
}
function enterKey() {
  flushLetters();
  if (state.enterBehavior === 'send') { commitBuffer(); resetNine(); send(); }
  else { commitBuffer(); resetNine(); insertChar('\n'); tick(380); Speech.speak('换行'); }
}
function pressKey(k) {
  if (k === 'shift') { state.shift = !state.shift; renderIme(); tick(700); Speech.speak(state.shift ? '大写' : '小写'); return; }
  if (k === 'back') { backspace(); return; }
  if (k === 'space') { spaceKey(); return; }
  if (k === 'enter') { enterKey(); return; }
  if (k === 'globe') { switchIme('system'); return; }
  if (k === '26') {
    state.layout = state.layout === 'qwerty' ? 'nine' : 'qwerty';
    state.page = 'abc';
    resetNine();
    renderIme();
    tick(600);
    Speech.speak(state.layout === 'qwerty' ? '二十六键' : '九键');
    return;
  }
  if (k === 'left' || k === 'right') { resetNine(); moveCaret(k === 'left' ? -1 : 1); tick(420); return; }
  if (k === 'abc') { state.page = 'abc'; renderIme(); tick(600); Speech.speak('字母'); return; }
  if (k === '123' || k === 'star') { state.page = 'sym'; resetNine(); renderIme(); tick(600); Speech.speak('数字与符号'); return; }
  if (k === 'hash') {
    flushLetters();
    commitBuffer(); resetNine(); insertChar('，'); tick(460);
    Speech.speak('逗号');
    return;
  }
  if (state.page === 'sym') {
    flushLetters();
    if (PUNCT_NAME[k]) {
      commitBuffer(); resetNine(); insertChar(k); tick(460); handleSentences();
      return;
    }
    commitBuffer(); resetNine(); insertChar(k); tick(460); Speech.speak(PUNCT_NAME[k] || k);
    return;
  }
  if (state.layout === 'nine' && k === '0') { spaceKey(); return; }
  if (state.layout === 'nine' && KEY9[k]) { nineTap(k); return; }
  typeChar(k);
}

/* ================= 发送与消息 ================= */
function addBubble(text) {
  els.empty.classList.add('hide');
  const id = 'm' + (++state.msgSeq);
  const div = document.createElement('div');
  div.className = 'msg';
  div.dataset.id = id;
  div.innerHTML =
    '<div class="msg-avatar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3v18M8.5 6.5v11M15.5 6.5v11M5 9.5v5M19 9.5v5"/></svg></div>' +
    '<div class="msg-body"><div class="msg-text"></div><div class="msg-wave"><span class="wave"><i></i><i></i><i></i><i></i><i></i></span></div></div>';
  div.querySelector('.msg-text').textContent = text;
  els.msgList.appendChild(div);
  scrollBottom();
  return div;
}
function send() {
  const text = els.input.value.trim();
  if (!text) { toast('还没有内容，先打点什么吧'); return; }
  const full = els.input.value;
  const div = addBubble(text);
  if (state.speechMode === 'sentence') {
    const tail = full.slice(state.spokenUpTo).trim();
    if (tail) Speech.speak(tail, { source: 'input' });
  } else {
    Speech.speak(text, { source: 'bubble', id: div.dataset.id });
  }
  els.input.value = '';
  els.input.style.height = 'auto';
  state.caret = 0; state.spokenUpTo = 0; state.buffer = '';
  renderCompose();
  scrollBottom();
}
/* ================= 输入法切换 ================= */
function switchIme(mode) {
  if (mode === state.ime) return;
  state.ime = mode;
  try { state.caret = els.input.selectionStart !== null ? els.input.selectionStart : els.input.value.length; } catch (e) {}
  if (mode === 'system') {
    els.ime.hidden = true;
    els.input.readOnly = false;
    els.imePillText.textContent = '系统输入法';
    els.input.focus();
    try { els.input.setSelectionRange(state.caret, state.caret); } catch (e) {}
    toast('已切换到系统输入法，可直接打字');
  } else {
    els.ime.hidden = false;
    els.input.readOnly = true;
    els.input.blur();
    els.imePillText.textContent = '自定义输入法';
    renderIme();
    toast('已切换到自定义输入法');
  }
}

/* ================= 提示 ================= */
function toast(msg) {
  els.toast.textContent = msg;
  els.toast.classList.add('show');
  clearTimeout(state.toastTimer);
  state.toastTimer = setTimeout(() => els.toast.classList.remove('show'), 2200);
  Speech.speak(msg, { source: 'toast' });
}

/* ================= 设置 ================= */
function modeLabel() { return state.speechMode === 'sentence' ? '打一句，念一句' : '打完按回车再念'; }
function enterLabel() { return state.enterBehavior === 'send' ? '发送' : '换行'; }
function rateLabel(r) {
  if (r <= 0.5) return '慢速';
  if (r <= 0.75) return '稍慢';
  if (r < 1.25) return '标准';
  if (r < 1.5) return '稍快';
  if (r < 2) return '快速';
  return '极速';
}
function pitchLabel(p) {
  if (p <= 0.5) return '低沉';
  if (p <= 0.75) return '稍低';
  if (p < 1.25) return '标准';
  if (p < 1.5) return '偏高';
  if (p < 2) return '清亮';
  return '尖细';
}
function openSettings() {
  els.settingsOverlay.hidden = false;

  els.settingsOverlay.classList.remove('show');

function closeWelcome() {
  els.welcomeOverlay.classList.remove('show');

function armWelcome() {
  const say = () => {
    if (!welcomed) {
      welcomed = true;
      Speech.speak('欢迎来到自言自语。在这里打下的每一个字，都会被大声念出来。连键盘、弹窗和提示，也都会自己开口说话。');

    document.removeEventListener('keydown', say);

/* ================= 事件 ================= */
function bindEvents() {
  els.ime.addEventListener('click', e => {
    const k = e.target.closest('.key');
    if (!k) return;
    pressKey(k.dataset.k);
  });
  /* 候选词点击：上屏并朗读 */
  els.composeText.addEventListener('click', e => {
    const chip = e.target.closest('.cand');
    if (!chip) return;
    flushLetters();
    resetNine();
    const w = chip.dataset.w;
    state.buffer = '';
    insertText(w);
    renderCompose();
    tick(500);
    Speech.speak(w, { source: 'input' });
    if (state.speechMode === 'sentence') state.spokenUpTo = state.caret;
  });
  els.sendBtn.addEventListener('click', send);
  els.input.addEventListener('input', () => syncInput(true));
  els.input.addEventListener('keydown', e => {
    if (state.ime === 'custom') return;
    if (e.key === 'Enter' && state.enterBehavior === 'send' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });
  els.imePillText.closest('.pill').addEventListener('click', () => switchIme(state.ime === 'custom' ? 'system' : 'custom'));
  els.stopBtn.addEventListener('click', () => { Speech.stop(); toast('好的，我安静了'); });
  els.brand.addEventListener('click', () => {
    Speech.speak('自言自语，打字转语音。连键盘、弹窗和提示，都会自己开口说话。', { source: 'toast' });
  });
  els.settingsBtn.addEventListener('click', openSettings);
  els.settingsClose.addEventListener('click', closeSettings);
  els.settingsOverlay.addEventListener('click', e => { if (e.target === els.settingsOverlay) closeSettings(); });
  els.welcomeBtn.addEventListener('click', closeWelcome);
  els.welcomeOverlay.addEventListener('click', e => {
    if (e.target === els.welcomeOverlay) closeWelcome();
  });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && els.settingsOverlay.classList.contains('show')) closeSettings();
  });

  els.modeSentence.addEventListener('change', () => {
    if (!els.modeSentence.checked) return;
    state.speechMode = 'sentence';
    Speech.speak('打一句，念一句');
  });
  els.modeEnter.addEventListener('change', () => {
    if (!els.modeEnter.checked) return;
    state.speechMode = 'enter';
    Speech.speak('打完按回车再念');
  });
  els.enterSend.addEventListener('change', () => {
    if (!els.enterSend.checked) return;
    state.enterBehavior = 'send';
    renderIme();
    Speech.speak('回车键：发送');
  });
  els.enterNewline.addEventListener('change', () => {
    if (!els.enterNewline.checked) return;
    state.enterBehavior = 'newline';
    renderIme();
    Speech.speak('回车键：换行');
  });
  els.layoutQwerty.addEventListener('change', () => {
    if (!els.layoutQwerty.checked) return;
    state.layout = 'qwerty';
    state.page = 'abc';
    resetNine();
    renderIme();
    Speech.speak('二十六键');
  });
  els.layoutNine.addEventListener('change', () => {
    if (!els.layoutNine.checked) return;
    state.layout = 'nine';
    state.page = 'abc';
    resetNine();
    renderIme();
    Speech.speak('九键');
  });
  els.listenBtn.addEventListener('click', () => {
    if (!('speechSynthesis' in window)) { toast('当前浏览器不支持语音合成'); return; }
    Speech.stop();
    Speech.speak('你好，我是自言自语。你听到我了吗？', { source: 'toast' });
  });
  els.voiceSel.addEventListener('change', () => {
    state.voiceURI = els.voiceSel.value;
    const v = state.voices.find(x => x.voiceURI === state.voiceURI);
    const short = v ? ((v.name || '').replace(/\s*(zh[-_ ]?CN|Chinese|普通话|中文).*$/i, '').trim() || v.name) : '';
    Speech.speak('声音：' + short);
  });
  els.rateRange.addEventListener('input', () => {
    state.rate = parseFloat(els.rateRange.value);
    els.rateVal.textContent = rateLabel(state.rate);
  });
  els.rateRange.addEventListener('change', () => Speech.speak('语速：' + rateLabel(state.rate)));
  els.pitchRange.addEventListener('input', () => {
    state.pitch = parseFloat(els.pitchRange.value);
    els.pitchVal.textContent = pitchLabel(state.pitch);
  });
  els.pitchRange.addEventListener('change', () => Speech.speak('音调：' + pitchLabel(state.pitch)));
}

/* ================= 启动 ================= */
function init() {
  renderIme();
  renderCompose();
  els.input.readOnly = true;
  bindEvents();
  showWelcome();
  armWelcome();
  if (!('speechSynthesis' in window)) {
    setTimeout(() => toast('当前浏览器不支持语音合成，请换用 Chrome / Edge / Safari 打开'), 900);
  }
}
init();
</script>
</body>
</html>
